<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-label="Unravel Reader: Hard books, plain words. Each page explained in simple words right beside it.">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="578" height="228" rx="24"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bef264" stop-opacity="0"/>
      <stop offset=".5" stop-color="#bef264" stop-opacity=".22"/>
      <stop offset="1" stop-color="#bef264" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="578" height="228" rx="24" fill="#ffffff" stroke="#e2e4e2" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect y="0" width="160" height="230" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;-300;780" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <rect x="32" y="40" width="112" height="112" rx="28" fill="#f5f5f3" stroke="#e2e4e2" stroke-width="2"/>
    <svg x="48" y="56" width="80" height="80" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#0b0b0b"/><path d="M8 36c3-10 12-11 10-3s-11 4-6-4 12-3 14 7h12" stroke="#fff" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 25Q48 36 59 36Q48 36 48 47Q48 36 37 36Q48 36 48 25z" fill="#d9f99d"/></svg>
  </g>
  <text x="168" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="36" letter-spacing="-.5" fill="#252728">Unravel Reader</text>
  <text x="168" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6d7273">Hard books, plain words. Each page explained</text><text x="168" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6d7273">in simple words right beside it.</text>
  <rect x="32" y="176" width="108" height="30" rx="15" fill="#fdf4e1"/>
  <circle cx="50" cy="191" r="5" fill="#c98c22"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="62" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a6a14">Building</text>
  <text x="548" y="197" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#176fd1">unravelreader.com →</text>
</svg>
